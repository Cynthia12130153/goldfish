<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1f26">
<meta name="description" content="30 秒，用紙網撈起越多金魚越好。慢慢移動，太快紙會破！">
<meta property="og:title" content="夜市撈金魚">
<meta property="og:description" content="30 秒，用紙網撈起越多金魚越好。慢慢移動，太快紙會破！">
<meta property="og:type" content="website">
<title>夜市撈金魚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* Layout: one-screen game — full-bleed canvas tank, HUD strip on top, paper-sign overlays for start/end */
:root{
  --deep:#0a1f26;
  --water:#13505a;
  --ink:#f6f0e2;
  --muted:#9cc3c3;
  --paper:#f4ead0;
  --paper-ink:#2b1c10;
  --stall:#d83a2a;
  --gold:#f5c542;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--deep);color:var(--ink);font-family:var(--f-body);-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:none}
.btn,.mute{touch-action:manipulation}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;pointer-events:none;font-variant-numeric:tabular-nums}
.time{font-family:var(--f-display);font-size:30px;line-height:1}
.time small{font-size:13px;color:var(--muted);margin-left:2px}
.time.low{color:#ff8a6b}
.papers{display:flex;flex-direction:column;align-items:center;gap:5px}
.nets{display:flex;gap:6px}
.net{width:18px;height:18px;border-radius:50%;border:3px solid #ff7fa0;background:color-mix(in srgb,var(--paper) 55%,transparent)}
.net.used{opacity:.25;background:transparent}
.bar{width:96px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--paper);transition:background .2s}
.bar i.warn{background:#ff8a6b}
.score{justify-self:end;text-align:right;font-family:var(--f-display);font-size:30px;line-height:1}
.score small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);letter-spacing:.08em;margin-top:3px}
.mute{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);right:max(16px,env(safe-area-inset-right,0px));background:rgba(0,0,0,.3);color:var(--ink);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 12px;font:13px var(--f-body);cursor:pointer}
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(5,18,22,.45)}
.sign{width:min(340px,100%);background:var(--paper);color:var(--paper-ink);border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.45);overflow:hidden;transform:rotate(-1.2deg)}
.sign header{background:var(--stall);color:var(--paper);text-align:center;padding-block:14px 10px;font-family:var(--f-display)}
.sign header .k{font-size:12px;letter-spacing:.3em;opacity:.85}
.sign header h1{margin:2px 0 0;font-size:44px;font-weight:400;letter-spacing:.08em;text-wrap:balance}
.sign .body{padding:18px 22px 22px;display:flex;flex-direction:column;gap:14px}
.sign p{margin:0;line-height:1.65;font-size:15px}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px}
.rules li{display:flex;gap:10px;align-items:baseline}
.rules b{font-family:var(--f-display);font-weight:400;color:var(--stall);min-width:3.5em}
.price{font-size:12px;color:#7a6650;border-top:1px dashed #c9b893;padding-top:10px;display:flex;justify-content:space-between}
.btn{appearance:none;border:0;border-radius:999px;background:var(--stall);color:var(--paper);font:20px var(--f-display);padding:12px 18px;cursor:pointer;box-shadow:0 4px 0 #8f1f14}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8f1f14}
.btn:focus-visible,.mute:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.result{text-align:center;display:flex;flex-direction:column;gap:4px}
.result .n{font-family:var(--f-display);font-size:64px;line-height:1;color:var(--stall)}
.result .t{font-family:var(--f-display);font-size:22px}
.result .s{font-size:13px;color:#7a6650}
</style>
</head>
<body>

<canvas id="c" aria-label="金魚池"></canvas>

<div class="hud" id="hud">
  <div class="time" id="time">30<small>秒</small></div>
  <div class="papers">
    <div class="nets" id="nets"><span class="net"></span><span class="net"></span><span class="net"></span></div>
    <div class="bar"><i id="dur"></i></div>
  </div>
  <div class="score" id="score">0<small>分</small></div>
</div>
<button class="mute" id="mute" type="button">聲音 開</button>

<div class="overlay" id="start">
  <div class="sign">
    <header><div class="k">夜 市 遊 戲</div><h1>撈金魚</h1></header>
    <div class="body">
      <p>30 秒，用紙網撈起越多金魚越好。紙很薄，動作太快會破，魚也會被嚇跑。</p>
      <ul class="rules">
        <li><b>按住</b>把紙網放進水裡，慢慢移到魚下面</li>
        <li><b>放開</b>把網子拿起來，網裡的魚就是你的</li>
        <li><b>金魚</b>一般 1 分，金色那隻 5 分，但比較重</li>
      </ul>
      <button class="btn" id="go" type="button">開始撈</button>
      <div class="price"><span>一次三張紙網</span><span>撈完可以再來</span></div>
    </div>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="sign">
    <header><div class="k" id="endk">時 間 到</div><h1 id="endt">收攤了</h1></header>
    <div class="body">
      <div class="result">
        <div class="n" id="endn">0</div>
        <div class="t" id="endr">夜市常客</div>
        <div class="s" id="ends">撈到 0 隻・最佳 0 分</div>
      </div>
      <button class="btn" id="again" type="button">再撈一次</button>
      <div class="price"><span>把網址傳給朋友比比看</span><span>🐟</span></div>
    </div>
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const hud=$('hud'),timeEl=$('time'),scoreEl=$('score'),durEl=$('dur'),netsEl=$('nets');
let W,H,U,R,T={x:0,y:0,w:0,h:0},pebbles=[];
const GAME_TIME=30, PAPERS=3;

function resize(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  U=Math.min(W,H)/400;R=Math.max(42,Math.min(66,Math.min(W,H)*.12));
  const top=hud.getBoundingClientRect().bottom+12;
  T={x:12,y:top,w:W-24,h:H-top-56};
  pebbles=[];for(let i=0;i<Math.floor(T.w*T.h/2600);i++)pebbles.push({x:T.x+Math.random()*T.w,y:T.y+Math.random()*T.h,r:(2+Math.random()*5)*U,c:Math.random()});
  fish.forEach(f=>{f.x=Math.min(Math.max(f.x,T.x+10),T.x+T.w-10);f.y=Math.min(Math.max(f.y,T.y+10),T.y+T.h-10)});
}

/* ---------- sound ---------- */
let ac=null,muted=false;
function initAudio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f,d,type='sine',vol=.15,slide=0,delay=0){if(!ac||muted)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}
function noise(d,vol,freq){if(!ac||muted)return;const n=ac.sampleRate*d,b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=freq;f.Q.value=.8;g.gain.value=vol;s.connect(f).connect(g).connect(ac.destination);s.start()}
const sfx={
  dip(){tone(420,.14,'sine',.18,140);noise(.12,.12,900)},
  lift(){noise(.25,.18,1400)},
  ding(gold){if(gold){[880,1108,1318,1760].forEach((f,i)=>tone(f,.25,'triangle',.1,0,i*.06))}else{tone(988,.18,'triangle',.12);tone(1480,.22,'sine',.06,0,.05)}},
  rip(){noise(.45,.4,2600);tone(200,.3,'sawtooth',.06,90)},
  end(){[660,550,440].forEach((f,i)=>tone(f,.3,'triangle',.1,0,i*.12))}
};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'聲音 關':'聲音 開'};

/* ---------- fish ---------- */
const KINDS=[
  {col:'#e2432a',fin:'#f28566'},
  {col:'#f08a24',fin:'#f7b877'},
  {col:'#1d1d24',fin:'#43434f'},
  {col:'#f3eee4',fin:'#f6d3c6',spot:'#e2432a'},
  {col:'#e2432a',fin:'#f28566',spot:'#f3eee4'}
];
let fish=[];
function mkFish(gold,edge){
  const k=gold?{col:'#f5c542',fin:'#ffe39a'}:KINDS[Math.floor(Math.random()*KINDS.length)];
  return {x:T.x+20+Math.random()*(T.w-40),y:T.y+20+Math.random()*(T.h-40),a:Math.random()*6.28,
    v:(26+Math.random()*26)*U,s:(gold?1.15:.8+Math.random()*.45)*U,gold,...k,
    phase:Math.random()*10,turn:0,flee:0,alpha:edge?0:1,curious:Math.random()<.45};
}
function populate(){fish=[];for(let i=0;i<13;i++)fish.push(mkFish(false));fish.push(mkFish(true));fish.push(mkFish(true))}

/* ---------- state ---------- */
let state='menu',time=GAME_TIME,score=0,caught=0,papersLeft=PAPERS,dur=100;
const scoop={x:0,y:0,px:0,py:0,tx:0,ty:0,down:false,hover:false,spd:0,still:0,rippleT:0};
let ripples=[],flyers=[],texts=[],tearFx=0,respawnQ=[],clock=0;
let best=0;try{best=+localStorage.getItem('goldfish-best')||0}catch(e){}

function updateHud(){
  timeEl.innerHTML=Math.ceil(time)+'<small>秒</small>';timeEl.classList.toggle('low',time<=5&&state==='play');
  scoreEl.innerHTML=score+'<small>分</small>';
  durEl.style.width=Math.max(0,dur)+'%';durEl.classList.toggle('warn',dur<35);
  [...netsEl.children].forEach((n,i)=>n.classList.toggle('used',i>=papersLeft));
}

function startGame(){
  initAudio();state='play';time=GAME_TIME;score=0;caught=0;papersLeft=PAPERS;dur=100;
  flyers=[];texts=[];respawnQ=[];populate();$('start').hidden=true;$('end').hidden=true;updateHud();
}
function endGame(torn){
  state='over';scoop.down=false;sfx.end();
  if(score>best){best=score;try{localStorage.setItem('goldfish-best',best)}catch(e){}}
  const rank=score===0?'空手而歸':score<5?'第一次撈':score<12?'夜市常客':score<20?'撈魚師傅':'老闆不讓你玩了';
  $('endk').textContent=torn?'紙 網 用 完':'時 間 到';
  $('endt').textContent=torn?'網子全破':'收攤了';
  $('endn').textContent=score;$('endr').textContent=rank;
  $('ends').textContent=`撈到 ${caught} 隻・最佳 ${best} 分`;
  setTimeout(()=>{$('end').hidden=false;$('again').focus()},500);
}
$('go').onclick=startGame;$('again').onclick=startGame;

/* ---------- input ---------- */
function inTank(x,y){return x>T.x&&x<T.x+T.w&&y>T.y&&y<T.y+T.h}
cv.addEventListener('pointerdown',e=>{
  if(state!=='play'||papersLeft<=0)return;
  if(!inTank(e.clientX,e.clientY))return;
  cv.setPointerCapture(e.pointerId);
  scoop.down=true;scoop.x=scoop.px=scoop.tx=e.clientX;scoop.y=scoop.py=scoop.ty=e.clientY;scoop.spd=0;scoop.still=0;
  dur-=2;sfx.dip();ripples.push({x:e.clientX,y:e.clientY,r:R*.6,a:.6});
});
cv.addEventListener('pointermove',e=>{scoop.tx=e.clientX;scoop.ty=e.clientY;scoop.hover=e.pointerType==='mouse';if(!scoop.down){scoop.x=scoop.tx;scoop.y=scoop.ty}});
cv.addEventListener('pointerleave',()=>{scoop.hover=false});
const lift=()=>{if(!scoop.down)return;scoop.down=false;if(state==='play')doLift()};
cv.addEventListener('pointerup',lift);cv.addEventListener('pointercancel',lift);

function doLift(){
  sfx.lift();ripples.push({x:scoop.x,y:scoop.y,r:R,a:.7});
  const got=fish.filter(f=>f.alpha>.6&&Math.hypot(f.x-scoop.x,f.y-scoop.y)<R*.82);
  const cost=got.reduce((s,f)=>s+(f.gold?16:7),0);
  if(dur<=0||(got.length&&dur-cost<=0)){tear();return}
  dur-=cost;
  const target=scoreEl.getBoundingClientRect();
  got.forEach((f,i)=>{
    fish.splice(fish.indexOf(f),1);caught++;score+=f.gold?5:1;
    flyers.push({f,x0:f.x,y0:f.y,x1:target.left+target.width/2,y1:target.top+target.height/2,t:-i*.08});
    texts.push({x:f.x,y:f.y,txt:f.gold?'+5':'+1',t:0,gold:f.gold});
    respawnQ.push({at:clock+1.2+Math.random()*1.5,gold:f.gold});
    setTimeout(()=>sfx.ding(f.gold),i*90);
  });
  updateHud();
}
function tear(){
  sfx.rip();tearFx=1;texts.push({x:scoop.x,y:scoop.y-R,txt:'破了！',t:0,bad:true});
  fish.forEach(f=>{if(Math.hypot(f.x-scoop.x,f.y-scoop.y)<R*1.5)f.flee=1.2});
  papersLeft--;scoop.down=false;
  if(papersLeft<=0){dur=0;updateHud();endGame(true);return}
  dur=100;updateHud();
}

/* ---------- update ---------- */
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=6.2832;while(d<-Math.PI)d+=6.2832;return d}
function update(dt){
  clock+=dt;
  if(scoop.down){
    scoop.x+=(scoop.tx-scoop.x)*Math.min(1,dt*22);scoop.y+=(scoop.ty-scoop.y)*Math.min(1,dt*22);
    scoop.x=Math.min(Math.max(scoop.x,T.x),T.x+T.w);scoop.y=Math.min(Math.max(scoop.y,T.y),T.y+T.h);
    const v=Math.hypot(scoop.x-scoop.px,scoop.y-scoop.py)/dt;scoop.spd+=(v-scoop.spd)*.35;
    scoop.px=scoop.x;scoop.py=scoop.y;
    scoop.still=scoop.spd<45*U?scoop.still+dt:0;
    const fast=Math.max(0,scoop.spd/U-170);
    dur-=dt*(2.5+fast*.06);
    scoop.rippleT-=dt;if(scoop.spd>120*U&&scoop.rippleT<=0){ripples.push({x:scoop.x,y:scoop.y,r:R*.9,a:.35});scoop.rippleT=.12}
    if(dur<=0&&state==='play')tear();
  }
  if(state==='play'){
    time-=dt;
    if(time<=0){time=0;if(scoop.down){scoop.down=false;doLift()}updateHud();endGame(false)}
    else updateHud();
  }
  for(let i=respawnQ.length-1;i>=0;i--)if(clock>=respawnQ[i].at){fish.push(mkFish(respawnQ[i].gold,true));respawnQ.splice(i,1)}

  const cx=T.x+T.w/2,cy=T.y+T.h/2,m=28*U;
  for(const f of fish){
    f.alpha=Math.min(1,f.alpha+dt*1.5);
    let desired=null,steer=3;
    if(f.x<T.x+m||f.x>T.x+T.w-m||f.y<T.y+m||f.y>T.y+T.h-m)desired=Math.atan2(cy-f.y+(Math.random()-.5)*80,cx-f.x);
    if(scoop.down){
      const dx=f.x-scoop.x,dy=f.y-scoop.y,d=Math.hypot(dx,dy);
      if(d<R*2.4&&scoop.spd>230*U)f.flee=.9;
      if(f.flee>0&&d<R*3.2){desired=Math.atan2(dy,dx);steer=9}
      else if(f.curious&&scoop.still>.6&&d<R*3&&d>R*.35&&desired===null){desired=Math.atan2(-dy,-dx);steer=1.4}
    }else if(f.flee>0){const dx=f.x-scoop.x,dy=f.y-scoop.y;if(Math.hypot(dx,dy)<R*3){desired=Math.atan2(dy,dx);steer=9}}
    if(desired!==null){const da=angDiff(desired,f.a);f.a+=Math.max(-1,Math.min(1,da))*dt*steer}
    else{f.turn+=(Math.random()-.5)*dt*7;f.turn*=Math.pow(.25,dt);f.a+=f.turn*dt}
    f.flee-=dt;
    const sp=f.v*(f.flee>0?3.4:1);
    f.phase+=dt*(f.flee>0?20:7);
    f.x+=Math.cos(f.a)*sp*dt;f.y+=Math.sin(f.a)*sp*dt;
    f.x=Math.min(Math.max(f.x,T.x+6),T.x+T.w-6);f.y=Math.min(Math.max(f.y,T.y+6),T.y+T.h-6);
  }
  ripples.forEach(r=>{r.r+=dt*90*U;r.a-=dt*.9});ripples=ripples.filter(r=>r.a>0);
  flyers.forEach(o=>o.t+=dt*1.6);flyers=flyers.filter(o=>o.t<1);
  texts.forEach(o=>o.t+=dt);texts=texts.filter(o=>o.t<1);
  tearFx=Math.max(0,tearFx-dt*2.5);
}

/* ---------- draw ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawFish(f,x,y,scale=1,alpha=f.alpha){
  ctx.save();ctx.translate(x,y);ctx.rotate(f.a);ctx.globalAlpha=alpha;
  const s=f.s*scale,w=Math.sin(f.phase)*.6;
  ctx.fillStyle='rgba(0,12,18,.28)';ctx.beginPath();ctx.ellipse(-2*s+4*U,5*U,11*s,5*s,0,0,7);ctx.fill();
  ctx.fillStyle=f.fin;ctx.beginPath();ctx.moveTo(-8*s,0);
  ctx.quadraticCurveTo(-14*s,-5*s+w*4*s,-21*s,-8*s+w*7*s);ctx.quadraticCurveTo(-16*s,w*3*s,-21*s,8*s+w*7*s);
  ctx.quadraticCurveTo(-14*s,5*s+w*4*s,-8*s,0);ctx.fill();
  ctx.beginPath();ctx.ellipse(2*s,-5*s,3*s,1.3*s,-.6+w*.3,0,7);ctx.ellipse(2*s,5*s,3*s,1.3*s,.6-w*.3,0,7);ctx.fill();
  ctx.fillStyle=f.col;ctx.beginPath();ctx.ellipse(0,0,11*s,5.3*s,0,0,7);ctx.fill();
  if(f.spot){ctx.fillStyle=f.spot;ctx.beginPath();ctx.ellipse(-1*s,0,5*s,3.4*s,.3,0,7);ctx.fill()}
  ctx.fillStyle='rgba(255,255,255,.28)';ctx.beginPath();ctx.ellipse(3*s,-1.6*s,5*s,1.5*s,0,0,7);ctx.fill();
  ctx.fillStyle='#0d0d10';ctx.beginPath();ctx.arc(7.3*s,-2.7*s,1.2*s,0,7);ctx.arc(7.3*s,2.7*s,1.2*s,0,7);ctx.fill();
  if(f.gold){ctx.fillStyle='rgba(255,250,220,'+(.5+.5*Math.sin(clock*6+f.phase))+')';ctx.beginPath();ctx.arc(-3*s,-2*s,1.2*s,0,7);ctx.fill()}
  ctx.restore();
}
function draw(){
  ctx.fillStyle='#0a1f26';ctx.fillRect(0,0,W,H);
  // tub rim
  ctx.save();rr(T.x-6,T.y-6,T.w+12,T.h+12,22);ctx.fillStyle='#2f7fc4';ctx.fill();
  rr(T.x,T.y,T.w,T.h,17);ctx.clip();
  const g=ctx.createLinearGradient(0,T.y,0,T.y+T.h);g.addColorStop(0,'#1d6f78');g.addColorStop(1,'#0f4752');
  ctx.fillStyle=g;ctx.fillRect(T.x,T.y,T.w,T.h);
  for(const p of pebbles){ctx.fillStyle=p.c<.5?'rgba(10,40,46,.55)':'rgba(120,170,160,.18)';ctx.beginPath();ctx.ellipse(p.x,p.y,p.r,p.r*.7,p.c*3,0,7);ctx.fill()}
  // caustics
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<6;i++){
    const x=T.x+T.w*(.5+.42*Math.sin(clock*.23+i*1.7)),y=T.y+T.h*(.5+.42*Math.cos(clock*.19+i*2.3)),r=(90+30*Math.sin(clock+i))*U;
    const cg=ctx.createRadialGradient(x,y,0,x,y,r);cg.addColorStop(0,'rgba(120,220,210,.07)');cg.addColorStop(1,'rgba(120,220,210,0)');
    ctx.fillStyle=cg;ctx.fillRect(x-r,y-r,r*2,r*2);
  }
  ctx.globalCompositeOperation='source-over';
  for(const f of fish)drawFish(f,f.x,f.y);
  for(const r of ripples){ctx.strokeStyle=`rgba(220,245,240,${r.a})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke()}
  // scoop
  if(scoop.down)drawScoop(true);
  ctx.restore();
  if(!scoop.down&&scoop.hover&&state==='play'&&inTank(scoop.x,scoop.y))drawScoop(false);
  if(tearFx>0){ctx.fillStyle=`rgba(216,58,42,${tearFx*.25})`;ctx.fillRect(0,0,W,H)}
  for(const o of flyers){if(o.t<0)continue;const t=o.t,e=t*t*(3-2*t);
    const x=o.x0+(o.x1-o.x0)*e,y=o.y0+(o.y1-o.y0)*e-Math.sin(t*Math.PI)*80*U;drawFish(o.f,x,y,1.4-t*.9,1-t*.6)}
  ctx.textAlign='center';
  for(const o of texts){ctx.globalAlpha=1-o.t;ctx.font=`${(o.bad?26:22)*Math.max(1,U)}px Huninn, "Noto Sans TC", sans-serif`;
    ctx.fillStyle=o.bad?'#ff8a6b':o.gold?'#f5c542':'#f6f0e2';ctx.fillText(o.txt,o.x,o.y-o.t*40*U)}
  ctx.globalAlpha=1;
}
function drawScoop(down){
  const x=scoop.x,y=scoop.y;
  ctx.save();ctx.globalAlpha=down?1:.45;
  // handle
  ctx.strokeStyle='#ff7fa0';ctx.lineWidth=7*Math.max(1,U*.9);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x+R*.72,y+R*.72);ctx.lineTo(x+R*1.75,y+R*1.75);ctx.stroke();
  // paper
  ctx.fillStyle=down?'rgba(244,234,208,.32)':'rgba(244,234,208,.12)';ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.fill();
  if(down&&dur<55){
    ctx.strokeStyle=`rgba(10,31,38,${(55-dur)/55*.6})`;ctx.lineWidth=1.2;ctx.beginPath();
    const n=Math.ceil((55-dur)/12);for(let i=0;i<n;i++){const a=i*2.1+.4;ctx.moveTo(x+Math.cos(a)*R*.95,y+Math.sin(a)*R*.95);
      ctx.lineTo(x+Math.cos(a+.25)*R*.6,y+Math.sin(a+.25)*R*.6);ctx.lineTo(x+Math.cos(a-.1)*R*.35,y+Math.sin(a-.1)*R*.35)}ctx.stroke();
  }
  // rim
  ctx.strokeStyle='#ff7fa0';ctx.lineWidth=5;ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.stroke();
  if(down){
    const warn=dur<35;
    ctx.strokeStyle=warn?'#ff8a6b':'rgba(246,240,226,.85)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(x,y,R+8,-Math.PI/2,-Math.PI/2+6.2832*Math.max(0,dur)/100);ctx.stroke();
    if(scoop.spd>230*U){ctx.fillStyle='#ff8a6b';ctx.font='15px "Noto Sans TC", sans-serif';ctx.textAlign='center';ctx.fillText('太快了！',x,y-R-16)}
  }
  ctx.restore();
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame)}
addEventListener('resize',resize);
resize();populate();updateHud();requestAnimationFrame(frame);
})();
</script>
